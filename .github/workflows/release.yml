name: Release

# Builds the Refund-Me image from its (private) source, checks that it starts, and publishes it at
# ghcr.io/oriyahoo/refund-me with the version, :latest and :sha-<commit>, plus a GitHub release
# here with that version's notes from CHANGELOG.md.
#
# Started by hand only (Actions → Release → Run workflow, or
# `gh workflow run release.yml -R oriyahoo/refund-me-app -f version=0.2.0`), by someone with write
# access to this repository. Nothing here runs for pull requests, and forks never see the secret.
#
# The source is fetched with a read-only deploy key of the source repository (secret
# SOURCE_DEPLOY_KEY); it can read that one repository and nothing else. The source isn't kept or
# published: only the built image is. Actions are pinned to a commit with the release as a comment.

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to publish, e.g. 0.2.0 (empty: the version in the source's package.json)"
        required: false
        default: ""
      ref:
        description: "Source branch, tag or commit to build"
        required: true
        default: main
      latest:
        description: "Also tag it :latest (what installs follow by default)"
        type: boolean
        default: true
      publish:
        description: "Publish it (off: build, check and scan only, e.g. to try a branch)"
        type: boolean
        default: true

permissions: {}

concurrency:
  group: release
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/oriyahoo/refund-me

jobs:
  release:
    name: Build, check and publish
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write       # the GitHub release and its tag
      packages: write       # the image
      id-token: write       # the signed build record
      attestations: write
    steps:
      - name: This repository (CHANGELOG.md)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          path: dist

      - name: The source (read-only deploy key)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: oriyahoo/refund-me
          ref: ${{ inputs.ref }}
          ssh-key: ${{ secrets.SOURCE_DEPLOY_KEY }}
          persist-credentials: false
          path: src

      - name: Version and tags
        id: v
        env:
          INPUT_VERSION: ${{ inputs.version }}
          INPUT_REF: ${{ inputs.ref }}
          LATEST: ${{ inputs.latest }}
          PUBLISH: ${{ inputs.publish }}
        run: |
          # A branch, tag or commit name only: inputs never reach a script as code.
          if ! printf '%s' "$INPUT_REF" | grep -Eq '^[A-Za-z0-9][A-Za-z0-9._/-]{0,199}$'; then
            echo "Not a branch, tag or commit name: $INPUT_REF" >&2; exit 1
          fi
          version="${INPUT_VERSION:-$(node -p "require('./src/package.json').version")}"
          if ! printf '%s' "$version" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$'; then
            echo "Not a version: $version" >&2; exit 1
          fi
          sha=$(git -C src rev-parse HEAD)
          if [ "$PUBLISH" = "true" ] && docker buildx imagetools inspect "$IMAGE:$version" >/dev/null 2>&1; then
            echo "$IMAGE:$version is already published. Versions don't change once out: pick a new one." >&2; exit 1
          fi
          tags="$IMAGE:$version,$IMAGE:sha-${sha::7}"
          [ "$LATEST" = "true" ] && tags="$tags,$IMAGE:latest"
          {
            echo "version=$version"
            echo "sha=$sha"
            echo "tags=$tags"
            echo "built=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          } >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build (for the check below)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: src
          load: true
          tags: refund-me:check
          build-args: |
            GIT_SHA=${{ steps.v.outputs.sha }}
            BUILD_TIME=${{ steps.v.outputs.built }}

      - name: The image starts and opens the setup wizard
        run: |
          openssl rand -base64 32 > key.txt && sudo chown 1000:1000 key.txt && sudo chmod 600 key.txt
          docker run -d --name check -p 3855:3855 -v "$PWD/key.txt:/run/secrets/k:ro" -e REFUND_ME_SECRET_FILE=/run/secrets/k refund-me:check
          for i in $(seq 1 60); do curl -sf http://localhost:3855/api/health >/dev/null && break; sleep 2; done
          curl -sf http://localhost:3855/api/health | grep -q '"setup"'
          curl -sfL http://localhost:3855/setup | grep -q 'name="provider"'
          docker run --rm --entrypoint chromium refund-me:check --version
          echo "OK: starts, reports setup, opens the wizard; Chromium is in."

      - name: PDF rendering and the native modules work
        run: |
          # Chromium prints a page with Hebrew and English text and an image to PDF, the way the
          # reports are made (no sandbox, no GPU, inline content only).
          docker run --rm --entrypoint sh refund-me:check -c '
            chromium --headless --no-sandbox --disable-gpu --disable-dev-shm-usage --no-pdf-header-footer \
              --print-to-pdf=/tmp/t.pdf "data:text/html;charset=utf-8,<html dir=rtl><body><h1>%D7%93%D7%95%D7%97 Report 186.50</h1><img src=\"data:image/gif;base64,R0lGODlhAQABAAAAACw=\"></body></html>" 2>/dev/null
            test -s /tmp/t.pdf && head -c 5 /tmp/t.pdf | grep -q %PDF && echo "PDF: $(wc -c < /tmp/t.pdf) bytes"'
          # The native modules load and work on this Debian: images (sharp), the canvas PDF pages
          # are drawn on, and the built-in SQLite database.
          docker run --rm --entrypoint node -w /app refund-me:check -e '
            const sharp = require("sharp");
            const Database = require("better-sqlite3");
            const { createCanvas } = require("@napi-rs/canvas");
            (async () => {
              const jpg = await sharp({ create: { width: 20, height: 20, channels: 3, background: "#e0a82e" } }).jpeg().toBuffer();
              const db = new Database(":memory:"); db.exec("create table t(x); insert into t values (1)");
              const c = createCanvas(10, 10); c.getContext("2d").fillRect(0, 0, 5, 5);
              console.log("native modules: sharp", jpg.length, "bytes; sqlite", db.prepare("select x from t").get().x, "; canvas", c.toBuffer("image/png").length, "bytes");
            })().catch((e) => { console.error(e); process.exit(1); });'

      - name: Scan the built image (when not publishing)
        if: ${{ !inputs.publish }}
        env:
          INPUT_REF: ${{ inputs.ref }}
        run: |
          curl -fsSL -o "$RUNNER_TEMP/osv-scanner" https://github.com/google/osv-scanner/releases/download/v2.6.0/osv-scanner_linux_amd64
          echo "ca69b3d3cd08f889a49dc0a383122f71cc528b83803671df5fd874d97485b108  $RUNNER_TEMP/osv-scanner" | sha256sum -c
          chmod +x "$RUNNER_TEMP/osv-scanner"
          set +e
          "$RUNNER_TEMP/osv-scanner" scan image refund-me:check --format=json --output-file=osv-image.json --verbosity=error
          set -e
          {
            echo "## Test build of \`$INPUT_REF\` (not published)"
            echo
            python3 -I dist/.github/scripts/osv-summary.py "Built image=osv-image.json"
          } >> "$GITHUB_STEP_SUMMARY"
          python3 -I - <<'PY'
          import json
          d = json.load(open("osv-image.json"))
          n = sum(len(p.get("groups", [])) for r in d.get("results", []) for p in r["packages"])
          print("known vulnerabilities in the built image:", n)
          PY

      - name: Keep the test scan
        if: ${{ !inputs.publish && always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: test-scan-${{ github.run_id }}
          path: osv-image.json
          if-no-files-found: ignore
          retention-days: 7

      - name: Logs (if the check failed)
        if: failure()
        run: docker logs check 2>&1 | tail -60 || true

      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        if: ${{ inputs.publish }}
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish
        if: ${{ inputs.publish }}
        id: push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: src
          push: true
          tags: ${{ steps.v.outputs.tags }}
          labels: |
            org.opencontainers.image.title=Refund-Me
            org.opencontainers.image.description=Expense reimbursement for Israeli companies, on your own server
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.version=${{ steps.v.outputs.version }}
            org.opencontainers.image.revision=${{ steps.v.outputs.sha }}
            org.opencontainers.image.licenses=LicenseRef-Refund-Me
          build-args: |
            GIT_SHA=${{ steps.v.outputs.sha }}
            BUILD_TIME=${{ steps.v.outputs.built }}
          sbom: true
          provenance: mode=max

      - name: Signed build record
        if: ${{ inputs.publish }}
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true

      - name: GitHub release with the notes
        if: ${{ inputs.publish }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.v.outputs.version }}
          DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          # This version's section of CHANGELOG.md ("## 0.2.0 ..." up to the next "## ").
          awk -v v="$VERSION" '$0 ~ "^## " { p = ($2 == v) } p' dist/CHANGELOG.md | tail -n +2 > notes.md
          [ -s notes.md ] || echo "See CHANGELOG.md." > notes.md
          printf '\n---\nImage: `%s:%s`\nDigest: `%s`\n' "$IMAGE" "$VERSION" "$DIGEST" >> notes.md
          gh release create "v$VERSION" -R "$GITHUB_REPOSITORY" --title "Refund-Me $VERSION" --notes-file notes.md --target "$GITHUB_SHA"
