name: Release

# Builds the Refund-Me image from its (private) source, checks that it starts, and publishes it at
# ghcr.io/oriyahoo/refund-me with the version, :latest and :sha-<commit>, plus a GitHub release
# here with that version's notes from CHANGELOG.md.
#
# Started by hand only (Actions → Release → Run workflow, or
# `gh workflow run release.yml -R oriyahoo/refund-me-app -f version=0.2.0`), by someone with write
# access to this repository. Nothing here runs for pull requests, and forks never see the secret.
#
# The source is fetched with a read-only deploy key of the source repository (secret
# SOURCE_DEPLOY_KEY); it can read that one repository and nothing else. The source isn't kept or
# published: only the built image is. Actions are pinned to a commit with the release as a comment.

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to publish, e.g. 0.2.0 (empty: the version in the source's package.json)"
        required: false
        default: ""
      ref:
        description: "Source branch, tag or commit to build"
        required: true
        default: main
      latest:
        description: "Also tag it :latest (what installs follow by default)"
        type: boolean
        default: true

permissions: {}

concurrency:
  group: release
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/oriyahoo/refund-me

jobs:
  release:
    name: Build, check and publish
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write       # the GitHub release and its tag
      packages: write       # the image
      id-token: write       # the signed build record
      attestations: write
    steps:
      - name: This repository (CHANGELOG.md)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          path: dist

      - name: The source (read-only deploy key)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: oriyahoo/refund-me
          ref: ${{ inputs.ref }}
          ssh-key: ${{ secrets.SOURCE_DEPLOY_KEY }}
          persist-credentials: false
          path: src

      - name: Version and tags
        id: v
        env:
          INPUT_VERSION: ${{ inputs.version }}
          LATEST: ${{ inputs.latest }}
        run: |
          version="${INPUT_VERSION:-$(node -p "require('./src/package.json').version")}"
          if ! printf '%s' "$version" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$'; then
            echo "Not a version: $version" >&2; exit 1
          fi
          sha=$(git -C src rev-parse HEAD)
          if docker buildx imagetools inspect "$IMAGE:$version" >/dev/null 2>&1; then
            echo "$IMAGE:$version is already published. Versions don't change once out: pick a new one." >&2; exit 1
          fi
          tags="$IMAGE:$version,$IMAGE:sha-${sha::7}"
          [ "$LATEST" = "true" ] && tags="$tags,$IMAGE:latest"
          {
            echo "version=$version"
            echo "sha=$sha"
            echo "tags=$tags"
            echo "built=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          } >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build (for the check below)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: src
          load: true
          tags: refund-me:check
          build-args: |
            GIT_SHA=${{ steps.v.outputs.sha }}
            BUILD_TIME=${{ steps.v.outputs.built }}

      - name: The image starts and opens the setup wizard
        run: |
          openssl rand -base64 32 > key.txt && sudo chown 1000:1000 key.txt && sudo chmod 600 key.txt
          docker run -d --name check -p 3855:3855 -v "$PWD/key.txt:/run/secrets/k:ro" -e REFUND_ME_SECRET_FILE=/run/secrets/k refund-me:check
          for i in $(seq 1 60); do curl -sf http://localhost:3855/api/health >/dev/null && break; sleep 2; done
          curl -sf http://localhost:3855/api/health | grep -q '"setup"'
          curl -sfL http://localhost:3855/setup | grep -q 'name="provider"'
          docker run --rm --entrypoint chromium refund-me:check --version
          echo "OK: starts, reports setup, opens the wizard; Chromium is in."

      - name: Logs (if the check failed)
        if: failure()
        run: docker logs check 2>&1 | tail -60 || true

      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish
        id: push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: src
          push: true
          tags: ${{ steps.v.outputs.tags }}
          labels: |
            org.opencontainers.image.title=Refund-Me
            org.opencontainers.image.description=Expense reimbursement for Israeli companies, on your own server
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.version=${{ steps.v.outputs.version }}
            org.opencontainers.image.revision=${{ steps.v.outputs.sha }}
            org.opencontainers.image.licenses=LicenseRef-Refund-Me
          build-args: |
            GIT_SHA=${{ steps.v.outputs.sha }}
            BUILD_TIME=${{ steps.v.outputs.built }}
          sbom: true
          provenance: mode=max

      - name: Signed build record
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true

      - name: GitHub release with the notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.v.outputs.version }}
          DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          # This version's section of CHANGELOG.md ("## 0.2.0 ..." up to the next "## ").
          awk -v v="$VERSION" '$0 ~ "^## " { p = ($2 == v) } p' dist/CHANGELOG.md | tail -n +2 > notes.md
          [ -s notes.md ] || echo "See CHANGELOG.md." > notes.md
          printf '\n---\nImage: `%s:%s`\nDigest: `%s`\n' "$IMAGE" "$VERSION" "$DIGEST" >> notes.md
          gh release create "v$VERSION" -R "$GITHUB_REPOSITORY" --title "Refund-Me $VERSION" --notes-file notes.md --target "$GITHUB_SHA"
