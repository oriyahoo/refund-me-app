name: Image scan

# Known vulnerabilities (CVE / GHSA / Debian advisories) in the published image
# ghcr.io/oriyahoo/refund-me: the operating-system packages of its Debian base, the Node.js
# runtime, Chromium and everything else installed in it, and the app's npm packages as they ship.
# Checked with Google's OSV-Scanner against osv.dev.
#
# When: after every release, every Sunday (new advisories appear for images that didn't change),
# and by hand (Actions → Image scan → Run workflow, with any published tag).
#
# REPORT ONLY: findings never fail the run. The table goes to the run's Summary page and is kept
# as an artifact for 30 days; the run is red only if the scan itself couldn't run. Only package
# names and versions go to osv.dev. No secrets, read-only permissions; actions pinned to a commit.

on:
  workflow_run:
    workflows: [Release]
    types: [completed]
  schedule:
    - cron: "45 4 * * 0" # Sundays
  workflow_dispatch:
    inputs:
      tag:
        description: "Image tag to scan (a version, or latest)"
        required: true
        default: latest

permissions:
  contents: read

concurrency:
  group: image-scan
  cancel-in-progress: true

env:
  IMAGE: ghcr.io/oriyahoo/refund-me
  OSV_VERSION: 2.6.0
  # From the release's osv-scanner_SHA256SUMS.
  OSV_SHA256: ca69b3d3cd08f889a49dc0a383122f71cc528b83803671df5fd874d97485b108

jobs:
  scan:
    name: OSV-Scanner (published image)
    # After a release: only when the release succeeded.
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install OSV-Scanner
        run: |
          curl -fsSL -o "$RUNNER_TEMP/osv-scanner" \
            "https://github.com/google/osv-scanner/releases/download/v${OSV_VERSION}/osv-scanner_linux_amd64"
          echo "${OSV_SHA256}  $RUNNER_TEMP/osv-scanner" | sha256sum -c
          chmod +x "$RUNNER_TEMP/osv-scanner"

      - name: Which image
        id: which
        env:
          TAG: ${{ inputs.tag || 'latest' }}
        run: |
          printf '%s' "$TAG" | grep -Eq '^[A-Za-z0-9_.-]{1,128}$' || { echo "Not a tag: $TAG" >&2; exit 1; }
          docker pull --quiet "$IMAGE:$TAG"
          digest=$(docker image inspect --format '{{index .RepoDigests 0}}' "$IMAGE:$TAG")
          version=$(docker image inspect --format '{{index .Config.Labels "org.opencontainers.image.version"}}' "$IMAGE:$TAG")
          { echo "ref=$IMAGE:$TAG"; echo "digest=$digest"; echo "version=$version"; } >> "$GITHUB_OUTPUT"

      # Exit code 1 means "vulnerabilities found": success for a report. Any other non-zero exit
      # deletes the JSON and leaves the reason, so the summary says the scan didn't run.
      - name: Scan the image
        continue-on-error: true
        env:
          REF: ${{ steps.which.outputs.ref }}
        run: |
          set +e
          "$RUNNER_TEMP/osv-scanner" scan image "$REF" --format=json --output-file=osv-image.json --verbosity=error
          status=$?
          if [ "$status" -le 1 ]; then exit 0; fi
          rm -f osv-image.json
          echo "osv-scanner exited ${status} (not a vulnerability result)" > osv-image.error
          exit "$status"

      - name: Write the report to the run summary
        if: always()
        env:
          REF: ${{ steps.which.outputs.ref }}
          DIGEST: ${{ steps.which.outputs.digest }}
          VERSION: ${{ steps.which.outputs.version }}
        run: |
          {
            echo "## Image scan: \`$REF\` (version ${VERSION:-unknown})"
            echo
            echo "Digest \`${DIGEST#*@}\`. Report from OSV-Scanner ${OSV_VERSION} (osv.dev); it never blocks a release."
            echo "Most findings in an image are in the operating-system packages; a fix usually arrives with a newer base image in the next release."
            echo
            python3 -I .github/scripts/osv-summary.py "Published image=osv-image.json"
          } | tee osv-report.md >> "$GITHUB_STEP_SUMMARY"
          ! [ -f osv-image.error ]

      - name: Keep the report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: image-scan-${{ github.run_id }}
          path: |
            osv-report.md
            osv-image.json
          if-no-files-found: ignore
          retention-days: 30
